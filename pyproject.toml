[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aps-method-framework"
version = "0.2.0"
description = "Method-only reference implementation of Adaptive Prototype Simulation."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.23,<3", "scikit-learn>=1.2,<2"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["aps_framework*"]

